<nav id="navbar" 
  class="text-white p-4 fixed top-0 w-full z-[99999] transition-colors duration-300"
  [ngClass]="{'bg-white/10 backdrop-blur-md shadow-lg border border-white/10': isScrolled}">
  <div class="container mx-auto flex items-center justify-between">
    
  <app-logo></app-logo>
    <ul class="hidden md:flex items-center space-x-6">
      <li><a href="#home" class="hover:text-blue-400 active-link">Home</a></li>
      <li><a href="#popular" class="hover:text-blue-400">Popular</a></li>
      <li><a href="#seller" class="hover:text-blue-400">Seller</a></li>
      <li><a href="#explore" class="hover:text-blue-400">Explore</a></li>
    </ul>

 <div class="hidden md:flex items-center space-x-4">
  <button class="flex items-center space-x-2 border border-gray-600 rounded-full px-4 py-2 text-sm hover:bg-gray-800 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
    </svg>
    <span>Search</span>
  </button>
  
  <app-button label="Register"></app-button>

  
</div>

 <div class="md:hidden">
  <button id="mobile-menu-button" (click)="toggleMobileMenu()" class="text-white focus:outline-none">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
    </svg>
  </button>
</div>

<!-- Backdrop -->
<div
  *ngIf="isMobileMenuOpen"
  class="fixed inset-0 bg-black/50 z-40 md:hidden"
  (click)="toggleMobileMenu()"
></div>

<!-- Slide-in Menu -->
<div
  id="mobile-menu"
  [ngClass]="{
    'translate-x-0 opacity-100': isMobileMenuOpen,
    'translate-x-full opacity-0 pointer-events-none': !isMobileMenuOpen
  }"
  class="md:hidden mt-4 fixed top-16 right-0 w-64 bg-[#0b0b25] h-screen transition-all duration-500 ease-in-out transform z-50 rounded-l-xl shadow-lg"
>
  <ul id="mobile-nav" class="flex flex-col space-y-2 p-4">
    <li><a href="#home" class="block py-2 px-3 hover:bg-gray-800 rounded">home</a></li>
    <li><a href="#popular" class="block py-2 px-3 hover:bg-gray-800 rounded">popular</a></li>
    <li><a href="#seller" class="block py-2 px-3 hover:bg-gray-800 rounded">seller</a></li>
    <li><a href="#explore" class="block py-2 px-3 hover:bg-gray-800 rounded">explore</a></li>
  </ul>
</div>

</div>
</nav>
