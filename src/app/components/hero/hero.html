<section id="home" class="hero-gradient-bg pt-28 md:pt-32 pb-20 relative overflow-hidden">
    <div class="container mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-0 items-center">

            <div class="text-white text-center md:text-left z-[999] relative">
                
                <div #mainHeading class="text-4xl lg:text-6xl font-extrabold leading-tight tracking-tight">
                    <h1 class="block">Discover, Collect</h1>
                    <h1 class="block">and Sell Dope</h1>
                    <h1 class="block">Art and NFTs</h1>
                </div>

                <p #subheading class="mt-6 text-gray-300 max-w-lg mx-auto md:mx-0">
                    The world's largest digital marketplace for crypto collections and non fungible tokens (NFTs).
                </p>

                <div #ctaButtons class="mt-10 flex flex-wrap justify-center md:justify-start items-center gap-4">
                    <app-button label="Discover"></app-button>
                    <button class="bg-white/10 border border-white/20 text-white font-bold rounded-full px-6 py-2 text-sm hover:bg-white/20">
                        Create
                    </button>
                </div>

                <div #statsBox class="bg-gradient-to-r from-[#4827ab] to-[#1b3d7c] backdrop-blur-md rounded-2xl w-[fit-content] px-5 py-4 mt-12 flex flex-wrap justify-center mx-auto md:mx-0 md:justify-start gap-x-8 gap-y-4 border border-white/20">
                    <div>
                        <p class="text-2xl font-bold">27k+</p>
                        <p class="text-sm text-gray-400">Art works</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold">20k+</p>
                        <p class="text-sm text-gray-400">Auctions</p>
                    </div>
                    <div>
                        <p class="text-2xl font-bold">7k+</p>
                        <p class="text-sm text-gray-400">Artists</p>
                    </div>
                </div>

                <div #userProof class="mt-10 mb-10 flex items-center justify-center md:justify-start gap-4 relative z-[99]">
                    <div class="flex -space-x-3">
                        <img class="inline-block h-10 w-10 rounded-full ring-2 ring-brand-bg-dark" src="https://images.unsplash.com/photo-1491528323818-fdd1faba62cc?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="User 1">
                        <img class="inline-block h-10 w-10 rounded-full ring-2 ring-brand-bg-dark" src="https://images.unsplash.com/photo-1550525811-e5869dd03032?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="User 2">
                        <img class="inline-block h-10 w-10 rounded-full ring-2 ring-brand-bg-dark" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2.25&w=256&h=256&q=80" alt="User 3">
                    </div>
                    <div>
                        <p class="font-bold">40k+</p>
                        <p class="text-sm text-gray-400">Active Users</p>
                    </div>
                </div>
            </div>

            <div #nftCard class="relative z-10">
                <div class="bg-gradient-to-r from-[#1e104b] to-[#1b3d7c] backdrop-blur-md border border-white/20 rounded-2xl p-4 md:p-6 max-w-sm mx-auto">
                    <img src='./nft-images/gambar-nft-9.jpg' alt="NFT Artwork" class="rounded-xl w-full">
                    <div class="mt-4 flex justify-between items-end text-white">
                        <div>
                            <p class="text-sm text-gray-300">Ending in:</p>
                            <p class="text-lg font-bold">1h 20m 30s</p>
                            <a href="#" class="text-sm text-blue-400 hover:underline">Place a Bid</a>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-300">Highest Bid</p>
                            <p class="text-lg font-bold">32.4 ETH</p>
                            <a href="#" class="text-sm text-blue-400 hover:underline">Purchase</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
