<section class="py-20 " id="seller">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl md:text-4xl font-bold text-white text-center mb-12">
      Top Sellers
    </h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6">
      
      <div *ngFor="let seller of sellers" class="seller-card">
        <div class="text-info">
          <p class="font-semibold text-white">{{ seller.name }}</p>
          <p class="text-sm text-gray-300">{{ seller.sales }} Eth</p>
        </div>

        <img class="seller-avatar" [src]="seller.avatarUrl" [alt]="seller.name">
      </div>

    </div>
  </div>
</section>
